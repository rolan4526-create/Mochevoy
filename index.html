<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Чекушка КотаКбас</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  #ui {
    position:fixed; inset:0; pointer-events:none;
    font-family: 'Arial Black', sans-serif; color:#fff;
    padding:12px; text-shadow:0 0 8px #0ff;
  }
  #hud {
    display:flex; justify-content:space-between; align-items:flex-start;
    font-size:18px;
  }
  #hudLeft { display:flex; align-items:center; gap:10px; }
  #lifeCube {
    width:48px; height:48px;
    transition: width 0.3s ease, height 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
    filter: drop-shadow(0 0 10px #0f8);
  }
  #lifeCube svg { width:100%; height:100%; display:block; }
  #hpText { font-size:16px; color:#0f8; text-shadow:0 0 8px #0f8; }
  #bossBar {
    position:fixed; top:70px; left:20px; right:20px;
    height:18px; background:rgba(0,0,0,0.7); border:2px solid #f33;
    border-radius:10px; overflow:hidden; display:none;
    box-shadow:0 0 20px #f33;
  }
  #bossBarFill {
    height:100%; width:100%;
    background:linear-gradient(90deg,#f00,#f80,#ff0);
    transition: width 0.2s ease;
  }
  #bossBarLabel {
    position:fixed; top:48px; left:20px; right:20px;
    text-align:center; font-family:'Arial Black',sans-serif;
    color:#f33; font-size:14px; text-shadow:0 0 10px #f33;
    display:none; letter-spacing:2px;
  }
  #buffHud {
    position:fixed; bottom:12px; left:12px; right:12px;
    display:flex; flex-wrap:wrap; gap:8px;
    font-family:'Arial Black',sans-serif;
    pointer-events:none;
  }
  .buffChip {
    padding:6px 12px; border-radius:20px;
    font-size:13px; color:#001; font-weight:bold;
    box-shadow:0 0 15px currentColor;
    animation: buffPulse 1s ease infinite;
  }
  .buffChip.shotgun { background:#ff8; }
  .buffChip.oneshot { background:#f8f; color:#fff; }
  @keyframes buffPulse {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.06); }
  }
  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px;
    background:rgba(0,0,20,0.88); color:#fff; font-family:'Arial Black',sans-serif;
    text-align:center; padding:20px; z-index:10;
  }
  #overlay h1 { font-size:30px; color:#0ff; text-shadow:0 0 20px #0ff; margin-bottom:6px; line-height:1.1;}
  #overlay p { font-size:16px; opacity:0.8; font-weight:normal; }
  #overlay button {
    pointer-events:auto; padding:16px 40px; font-size:22px;
    background:linear-gradient(135deg,#0ff,#08f); border:none; border-radius:50px;
    color:#001; font-weight:bold; cursor:pointer; box-shadow:0 0 30px #0ff;
    font-family:inherit;
  }
  #overlay button:active { transform:scale(0.95); }
  #overlay.hidden { display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bossBarLabel">⚡ БОСС: ЧЕКУШКА-МАТЬ ⚡</div>
<div id="bossBar"><div id="bossBarFill"></div></div>
<div id="ui">
  <div id="hud">
    <div id="hudLeft">
      <div id="lifeCube"></div>
      <div id="hpText">3</div>
    </div>
    <div>⭐ <span id="score">0</span></div>
  </div>
</div>
<div id="buffHud"></div>
<div id="overlay">
  <h1>ЧЕКУШКА КОТАКБАС</h1>
  <p>Води пальцем — корабль летит за ним.<br>Стреляет автоматически. Не пропускай врагов!<br><br><span style="color:#fd0">Убей 200 врагов — сразись с БОССОМ (100 HP)</span><br><span style="color:#0f8">Лови улучшения!</span></p>
  <button id="startBtn">БОЛЫ БУРМАЛДА</button>
</div>

<script>
(function(){
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ===== Кубик жизни =====
  function renderLifeCube(hp) {
    var el = document.getElementById('lifeCube');
    var txt = document.getElementById('hpText');

    if (hp <= 0) {
      el.style.width = '26px'; el.style.height = '26px';
      el.style.filter = 'drop-shadow(0 0 10px #f44) grayscale(1)';
      el.style.opacity = '0.3';
      txt.textContent = '0'; txt.style.color = '#f44';
      txt.style.textShadow = '0 0 8px #f44';
      el.innerHTML = cubeSVG('#888','#555','#333');
      return;
    }
    var map = {
      3: { top:'#5fff8a', left:'#22aa55', right:'#0f7a3a', glow:'#0f8', size:48 },
      2: { top:'#ffe066', left:'#cc9900', right:'#aa7700', glow:'#fd0', size:36 },
      1: { top:'#ff6b6b', left:'#cc2222', right:'#991111', glow:'#f33', size:26 }
    };
    var c = map[hp] || map[1];
    el.style.width = c.size + 'px';
    el.style.height = c.size + 'px';
    el.style.opacity = '1';
    el.style.filter = 'drop-shadow(0 0 10px ' + c.glow + ')';
    el.innerHTML = cubeSVG(c.top, c.left, c.right);
    txt.textContent = hp;
    txt.style.color = c.glow;
    txt.style.textShadow = '0 0 8px ' + c.glow;
  }

  function cubeSVG(top, left, right) {
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
      '<polygon points="50,5 95,30 50,55 5,30" fill="' + top + '" stroke="#000" stroke-width="2"/>' +
      '<polygon points="5,30 50,55 50,95 5,70" fill="' + left + '" stroke="#000" stroke-width="2"/>' +
      '<polygon points="95,30 50,55 50,95 95,70" fill="' + right + '" stroke="#000" stroke-width="2"/>' +
      '<polygon points="50,10 85,30 50,50 15,30" fill="#fff" opacity="0.25"/>' +
      '</svg>';
  }

  // ===== Состояние =====
  var player, bullets, enemies, particles, stars, bossBullets, powerups;
  var hp, score, running = false, lastTime = 0, spawnTimer = 0, fireTimer = 0, difficulty = 1;
  var boss = null;
  var bossTriggered = false;
  var BOSS_HP = 100;
  var BOSS_TRIGGER = 200;
  var bossAttackTimer = 0;
  var screenShake = 0;
  var victory = false;

  // ==== УЛУЧШЕНИЯ ====
  var buffShotgun = 0;   // таймер "тройной выстрел" (сек)
  var buffOneShot = 0;   // таймер "пули ваншотят" (сек)
  var buffHudEl = document.getElementById('buffHud');

  var bossBarEl = document.getElementById('bossBar');
  var bossBarFillEl = document.getElementById('bossBarFill');
  var bossBarLabelEl = document.getElementById('bossBarLabel');

  function initGame() {
    player = { x: W/2, y: H - 120, r: 18, targetX: W/2, targetY: H - 120 };
    bullets = []; enemies = []; particles = []; stars = []; bossBullets = []; powerups = [];
    for (var i = 0; i < 80; i++) {
      stars.push({ x: Math.random()*W, y: Math.random()*H,
                   speed: 0.5 + Math.random()*2, size: Math.random()*2+0.5 });
    }
    hp = 3; score = 0; spawnTimer = 0; fireTimer = 0; difficulty = 1;
    boss = null; bossTriggered = false; bossAttackTimer = 0;
    screenShake = 0; victory = false;
    buffShotgun = 0; buffOneShot = 0;
    bossBarEl.style.display = 'none';
    bossBarLabelEl.style.display = 'none';
    buffHudEl.innerHTML = '';
    renderLifeCube(hp);
    document.getElementById('score').textContent = score;
  }

  function pointerMove(e) {
    if (!running) return;
    var t = (e.touches && e.touches.length) ? e.touches[0] : e;
    var rect = canvas.getBoundingClientRect();
    player.targetX = t.clientX - rect.left;
    player.targetY = t.clientY - rect.top;
    if (e.cancelable) e.preventDefault();
  }
  canvas.addEventListener('touchstart', pointerMove, {passive:false});
  canvas.addEventListener('touchmove', pointerMove, {passive:false});
  canvas.addEventListener('mousedown', pointerMove);
  canvas.addEventListener('mousemove', function(e){ if (e.buttons) pointerMove(e); });

  function spawnEnemy() {
    var r = 14 + Math.random()*10;
    var maxHp = r < 17 ? 1 : (r < 22 ? 2 : 3);
    enemies.push({
      x: r + Math.random()*(W - r*2),
      y: -r - 20, r: r,
      vy: 1.2 + difficulty*0.35 + Math.random()*0.8,
      vx: (Math.random()-0.5) * (0.5 + difficulty*0.3),
      hp: maxHp, maxHp: maxHp,
      hue: 0 + Math.random()*40, rot: 0, hitFlash: 0
    });
  }

  // ==== Дроп улучшения ====
  function maybeDropPowerup(x, y) {
    // 12% шанс дропа с каждого врага
    if (Math.random() > 0.12) return;
    var type = Math.random() < 0.5 ? 'shotgun' : 'oneshot';
    powerups.push({
      x: x, y: y, r: 16, vy: 2.5, type: type,
      rot: 0, life: 8
    });
  }

  function activatePowerup(type) {
    if (type === 'shotgun') {
      buffShotgun = 10;      // 10 секунд
      if (navigator.vibrate) navigator.vibrate(60);
      explode(player.x, player.y, '#ff8', 20);
    } else if (type === 'oneshot') {
      buffOneShot = 5;       // 5 секунд
      if (navigator.vibrate) navigator.vibrate([40,30,40]);
      explode(player.x, player.y, '#f8f', 20);
    }
    updateBuffHud();
  }

  function updateBuffHud() {
    var html = '';
    if (buffShotgun > 0) {
      html += '<div class="buffChip shotgun">🔥 ТРОЙНОЙ ' + buffShotgun.toFixed(1) + 'с</div>';
    }
    if (buffOneShot > 0) {
      html += '<div class="buffChip oneshot">💀 ВАНШОТ ' + buffOneShot.toFixed(1) + 'с</div>';
    }
    buffHudEl.innerHTML = html;
  }

  function spawnBoss() {
    bossTriggered = true;
    for (var i = enemies.length-1; i >= 0; i--) {
      explode(enemies[i].x, enemies[i].y, 'hsl(' + enemies[i].hue + ',100%,60%)', 8);
    }
    enemies = [];
    // убираем все улучшения с экрана (по требованию — с боссом не летят)
    powerups = [];
    boss = {
      x: W/2, y: -100, targetY: 140, r: 55,
      hp: BOSS_HP, maxHp: BOSS_HP,
      vx: 2.2, hitFlash: 0, rot: 0, entered: false, phase: 1
    };
    bossBarEl.style.display = 'block';
    bossBarLabelEl.style.display = 'block';
    bossBarFillEl.style.width = '100%';
    screenShake = 1.0;
    if (navigator.vibrate) navigator.vibrate([100,50,100,50,200]);
  }

  function explode(x, y, color, count) {
    count = count || 14;
    for (var i = 0; i < count; i++) {
      var a = Math.random()*Math.PI*2, s = 1 + Math.random()*4;
      particles.push({
        x: x, y: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
        life: 1, color: color, size: 1 + Math.random()*3
      });
    }
  }

  function update(dt) {
    var i, j, b, e, p, dx, dy;

    if (screenShake > 0) screenShake -= dt * 3;

    // таймеры улучшений
    if (buffShotgun > 0) buffShotgun = Math.max(0, buffShotgun - dt);
    if (buffOneShot > 0) buffOneShot = Math.max(0, buffOneShot - dt);
    updateBuffHud();

    for (i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += s.speed * (1 + difficulty*0.3);
      if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
    }

    player.x += (player.targetX - player.x) * Math.min(1, dt*14);
    player.y += (player.targetY - player.y) * Math.min(1, dt*14);
    player.x = Math.max(player.r, Math.min(W-player.r, player.x));
    player.y = Math.max(player.r+50, Math.min(H-player.r-10, player.y));

    // ==== АВТОСТРЕЛЬБА (с учётом улучшений) ====
    fireTimer -= dt;
    if (fireTimer <= 0) {
      fireTimer = boss ? 0.12 : 0.16;
      if (buffShotgun > 0) {
        // тройной выстрел (тройной веер)
        bullets.push({ x: player.x, y: player.y - player.r, vy: -12, r: 4, vx: 0 });
        bullets.push({ x: player.x, y: player.y - player.r, vy: -12, r: 4, vx: -3.5 });
        bullets.push({ x: player.x, y: player.y - player.r, vy: -12, r: 4, vx: 3.5 });
      } else {
        bullets.push({ x: player.x, y: player.y - player.r, vy: -12, r: 4, vx: 0 });
        if (score > 30) {
          bullets.push({ x: player.x-10, y: player.y - player.r+6, vy: -12, r: 3, vx: 0 });
          bullets.push({ x: player.x+10, y: player.y - player.r+6, vy: -12, r: 3, vx: 0 });
        }
      }
    }

    // ==== УЛУЧШЕНИЯ ЛЕТЯТ ВНИЗ ====
    for (i = powerups.length-1; i >= 0; i--) {
      var pu = powerups[i];
      pu.y += pu.vy;
      pu.rot += dt * 3;
      pu.life -= dt;
      if (pu.y > H + 40 || pu.life <= 0) { powerups.splice(i,1); continue; }
      dx = pu.x - player.x; dy = pu.y - player.y;
      if (dx*dx + dy*dy < (pu.r + player.r)*(pu.r + player.r)) {
        activatePowerup(pu.type);
        powerups.splice(i,1);
      }
    }

    // ==== БОСС ====
    if (boss) {
      if (!boss.entered) {
        boss.y += (boss.targetY - boss.y) * Math.min(1, dt*3);
        if (Math.abs(boss.y - boss.targetY) < 2) boss.entered = true;
      } else {
        boss.x += boss.vx;
        if (boss.x < boss.r + 20 || boss.x > W - boss.r - 20) boss.vx *= -1;
        boss.rot += dt * 1.5;

        var ratio = boss.hp / boss.maxHp;
        boss.phase = ratio > 0.66 ? 1 : (ratio > 0.33 ? 2 : 3);

        bossAttackTimer -= dt;
        if (bossAttackTimer <= 0) {
          if (boss.phase === 1) {
            bossAttackTimer = 0.9;
            for (var k = -1; k <= 1; k++) {
              bossBullets.push({
                x: boss.x + k*30, y: boss.y + boss.r*0.6,
                vx: k * 1.2, vy: 4, r: 8, hue: 0
              });
            }
          } else if (boss.phase === 2) {
            bossAttackTimer = 1.0;
            for (var a = -2; a <= 2; a++) {
              var ang = Math.PI/2 + a*0.25;
              bossBullets.push({
                x: boss.x, y: boss.y + boss.r*0.6,
                vx: Math.cos(ang)*4, vy: Math.sin(ang)*4,
                r: 7, hue: 30
              });
            }
          } else {
            bossAttackTimer = 0.7;
            var dxp = player.x - boss.x, dyp = player.y - boss.y;
            var d = Math.sqrt(dxp*dxp + dyp*dyp) || 1;
            bossBullets.push({
              x: boss.x, y: boss.y + boss.r*0.6,
              vx: dxp/d*5, vy: dyp/d*5, r: 8, hue: 60
            });
            for (var a2 = -2; a2 <= 2; a2++) {
              var ang2 = Math.PI/2 + a2*0.3;
              bossBullets.push({
                x: boss.x, y: boss.y + boss.r*0.6,
                vx: Math.cos(ang2)*3.5, vy: Math.sin(ang2)*3.5,
                r: 5, hue: 60
              });
            }
          }
          if (navigator.vibrate) navigator.vibrate(20);
        }

        dx = boss.x - player.x; dy = boss.y - player.y;
        if (dx*dx + dy*dy < (boss.r + player.r)*(boss.r + player.r) * 0.7) {
          loseHP(); loseHP();
          screenShake = 1.2;
        }
      }

      if (boss.hitFlash > 0) boss.hitFlash -= dt * 4;
      bossBarFillEl.style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';

      if (boss.hp <= 0) {
        victory = true;
        for (var v = 0; v < 40; v++) {
          explode(boss.x + (Math.random()-0.5)*120,
                  boss.y + (Math.random()-0.5)*120,
                  'hsl(' + Math.random()*360 + ',100%,60%)', 15);
        }
        screenShake = 1.5;
        if (navigator.vibrate) navigator.vibrate([200,100,200,100,400]);
        boss = null;
        bossBarEl.style.display = 'none';
        bossBarLabelEl.style.display = 'none';
        setTimeout(showVictory, 800);
        running = false;
      }
    } else {
      if (!bossTriggered) {
        difficulty = 1 + score / 25;
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnTimer = Math.max(0.28, 0.9 - difficulty*0.08);
          spawnEnemy();
        }
        if (score >= BOSS_TRIGGER) spawnBoss();
      }
    }

    // пули игрока
    for (i = bullets.length-1; i >= 0; i--) {
      b = bullets[i];
      b.y += b.vy;
      b.x += (b.vx || 0);
      if (b.y < -20 || b.x < -20 || b.x > W+20) bullets.splice(i,1);
    }

    // пули босса
    for (i = bossBullets.length-1; i >= 0; i--) {
      b = bossBullets[i];
      b.x += b.vx; b.y += b.vy;
      if (b.y > H + 30 || b.x < -30 || b.x > W + 30) { bossBullets.splice(i,1); continue; }
      dx = b.x - player.x; dy = b.y - player.y;
      if (dx*dx + dy*dy < (b.r + player.r*0.7)*(b.r + player.r*0.7)) {
        bossBullets.splice(i,1);
        loseHP();
        screenShake = 0.8;
        explode(b.x, b.y, 'hsl(' + b.hue + ',100%,60%)', 10);
      }
    }

    // обычные враги
    for (i = enemies.length-1; i >= 0; i--) {
      e = enemies[i];
      e.y += e.vy; e.x += e.vx; e.rot += dt*3;
      if (e.hitFlash > 0) e.hitFlash -= dt * 4;
      if (e.x < e.r || e.x > W-e.r) e.vx *= -1;
      if (e.y > H + 40) { enemies.splice(i,1); loseHP(); continue; }

      dx = e.x - player.x; dy = e.y - player.y;
      if (dx*dx + dy*dy < (e.r + player.r)*(e.r + player.r)) {
        explode(e.x, e.y, 'hsl(' + e.hue + ',100%,60%)', 20);
        enemies.splice(i,1);
        loseHP();
        continue;
      }
    }

    // пули игрока vs враги
    for (i = bullets.length-1; i >= 0; i--) {
      b = bullets[i];
      for (j = enemies.length-1; j >= 0; j--) {
        e = enemies[j];
        dx = e.x - b.x; dy = e.y - b.y;
        if (dx*dx + dy*dy < (e.r + b.r)*(e.r + b.r)) {
          bullets.splice(i,1);
          // ваншот = снимаем весь HP
          if (buffOneShot > 0) {
            e.hp = 0;
          } else {
            e.hp--;
          }
          e.hitFlash = 1;
          if (e.hp <= 0) {
            explode(e.x, e.y, 'hsl(' + e.hue + ',100%,60%)', 18);
            enemies.splice(j,1);
            score += e.maxHp;
            document.getElementById('score').textContent = score;
            maybeDropPowerup(e.x, e.y);
          } else {
            explode(b.x, b.y, '#fff', 4);
          }
          break;
        }
      }
    }

    // пули игрока vs босс
    if (boss) {
      for (i = bullets.length-1; i >= 0; i--) {
        b = bullets[i];
        dx = boss.x - b.x; dy = boss.y - b.y;
        if (dx*dx + dy*dy < (boss.r + b.r)*(boss.r + b.r)) {
          bullets.splice(i,1);
          // ваншот на босса НЕ действует (иначе слишком легко)
          boss.hp--;
          boss.hitFlash = 1;
          explode(b.x, b.y, '#fff', 5);
          if (navigator.vibrate) navigator.vibrate(15);
        }
      }
    }

    // частицы
    for (i = particles.length-1; i >= 0; i--) {
      p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life -= dt*2.5;
      if (p.life <= 0) particles.splice(i,1);
    }
  }

  function loseHP() {
    hp--;
    renderLifeCube(hp);
    if (navigator.vibrate) navigator.vibrate(80);
    if (hp <= 0) gameOver();
  }

  function draw() {
    var i;

    ctx.save();
    if (screenShake > 0) {
      ctx.translate((Math.random()-0.5)*screenShake*10,
                    (Math.random()-0.5)*screenShake*10);
    }

    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#020014');
    g.addColorStop(1, boss ? '#200000' : '#0a0030');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = '#fff';
    for (i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = 0.3 + s.speed*0.3;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;

    // частицы
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ==== УЛУЧШЕНИЯ ====
    for (i = 0; i < powerups.length; i++) {
      var pu = powerups[i];
      ctx.save();
      ctx.translate(pu.x, pu.y);
      ctx.rotate(pu.rot);

      if (pu.type === 'shotgun') {
        // жёлтый ромб с 3 стрелками
        ctx.shadowBlur = 20; ctx.shadowColor = '#ff8';
        ctx.fillStyle = 'rgba(255,255,100,0.3)';
        ctx.beginPath();
        ctx.arc(0, 0, pu.r*1.3, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#ff8';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -pu.r);
        ctx.lineTo(pu.r, 0);
        ctx.lineTo(0, pu.r);
        ctx.lineTo(-pu.r, 0);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // три стрелки
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#800';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('⋀', 0, -4);
        ctx.fillText('⋀', -7, 4);
        ctx.fillText('⋀', 7, 4);
      } else {
        // розовый ромб с черепом
        ctx.shadowBlur = 20; ctx.shadowColor = '#f8f';
        ctx.fillStyle = 'rgba(255,150,255,0.3)';
        ctx.beginPath();
        ctx.arc(0, 0, pu.r*1.3, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#f8f';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -pu.r);
        ctx.lineTo(pu.r, 0);
        ctx.lineTo(0, pu.r);
        ctx.lineTo(-pu.r, 0);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#400';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('☠', 0, 1);
      }
      ctx.restore();
    }
    ctx.shadowBlur = 0;

    // пули игрока
    var bulletColor = buffOneShot > 0 ? '#f8f' : (buffShotgun > 0 ? '#ff8' : '#0ff');
    for (i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      ctx.shadowBlur = 12; ctx.shadowColor = bulletColor;
      ctx.fillStyle = bulletColor;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // пули босса
    for (i = 0; i < bossBullets.length; i++) {
      var bb = bossBullets[i];
      ctx.shadowBlur = 15;
      ctx.shadowColor = 'hsl(' + bb.hue + ',100%,60%)';
      ctx.fillStyle = 'hsl(' + bb.hue + ',100%,60%)';
      ctx.beginPath();
      ctx.arc(bb.x, bb.y, bb.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // враги
    for (i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(e.rot);
      ctx.shadowBlur = 15;
      ctx.shadowColor = 'hsl(' + e.hue + ',100%,60%)';
      ctx.fillStyle = e.hitFlash > 0
        ? 'rgba(255,255,255,' + Math.min(1, e.hitFlash) + ')'
        : 'hsl(' + e.hue + ',100%,55%)';
      ctx.beginPath();
      ctx.moveTo(0, -e.r); ctx.lineTo(e.r, 0); ctx.lineTo(0, e.r); ctx.lineTo(-e.r, 0);
      ctx.closePath(); ctx.fill();
      ctx.restore();

      if (e.maxHp > 1) {
        var barW = e.r * 2.2, barH = 4;
        var barX = e.x - barW/2, barY = e.y - e.r - 10;
        var ratio = e.hp / e.maxHp;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
        var barColor = ratio > 0.6 ? '#0f8' : (ratio > 0.3 ? '#fd0' : '#f33');
        ctx.shadowBlur = 6; ctx.shadowColor = barColor;
        ctx.fillStyle = barColor;
        ctx.fillRect(barX, barY, barW * ratio, barH);
        ctx.shadowBlur = 0;
        ctx.font = 'bold ' + Math.max(10, e.r*0.7) + 'px Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 4; ctx.shadowColor = '#000';
        ctx.fillText(e.hp, e.x, e.y);
        ctx.shadowBlur = 0;
      }
    }

    // БОСС
    if (boss) {
      ctx.save();
      ctx.translate(boss.x, boss.y);
      ctx.rotate(boss.rot);

      ctx.shadowBlur = 40;
      ctx.shadowColor = boss.phase === 3 ? '#f00' : (boss.phase === 2 ? '#f80' : '#ff0');
      var auraGrad = ctx.createRadialGradient(0,0,0, 0,0,boss.r*1.5);
      auraGrad.addColorStop(0, 'rgba(255,0,0,0.4)');
      auraGrad.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = auraGrad;
      ctx.beginPath(); ctx.arc(0,0,boss.r*1.5,0,Math.PI*2); ctx.fill();

      ctx.shadowBlur = 30;
      ctx.shadowColor = boss.hitFlash > 0 ? '#fff' : '#f33';
      ctx.fillStyle = boss.hitFlash > 0
        ? 'rgba(255,255,255,' + Math.min(1, boss.hitFlash) + ')'
        : '#c00';
      ctx.beginPath();
      ctx.moveTo(0, -boss.r); ctx.lineTo(boss.r, 0);
      ctx.lineTo(0, boss.r); ctx.lineTo(-boss.r, 0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ff0'; ctx.lineWidth = 3; ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, boss.r*0.35, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(0, 0, boss.r*0.18, 0, Math.PI*2); ctx.fill();
      var angToPlayer = Math.atan2(player.y - boss.y, player.x - boss.x);
      ctx.fillStyle = '#f00';
      ctx.beginPath();
      ctx.arc(Math.cos(angToPlayer)*boss.r*0.12,
              Math.sin(angToPlayer)*boss.r*0.12,
              boss.r*0.08, 0, Math.PI*2);
      ctx.fill();

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    // игрок
    ctx.save();
    ctx.translate(player.x, player.y);
    var playerGlow = buffOneShot > 0 ? '#f8f' : (buffShotgun > 0 ? '#ff8' : '#0ff');
    ctx.shadowBlur = 20; ctx.shadowColor = playerGlow;
    ctx.fillStyle = playerGlow;
    ctx.beginPath();
    ctx.moveTo(0, -player.r);
    ctx.lineTo(player.r*0.8, player.r*0.7);
    ctx.lineTo(0, player.r*0.35);
    ctx.lineTo(-player.r*0.8, player.r*0.7);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, -4, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    if (hp <= 0) {
      ctx.fillStyle = 'rgba(255,0,0,0.3)';
      ctx.fillRect(0,0,W,H);
    }

    ctx.restore();
  }

  function loop(now) {
    if (!running) return;
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function idleLoop() {
    if (running) return;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += s.speed*0.5;
      if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
    }
    draw();
    requestAnimationFrame(idleLoop);
  }

  var overlay = document.getElementById('overlay');

  function bindStart() {
    var btn = document.getElementById('startBtn');
    if (!btn) return;
    var handler = function(ev){
      if (ev) { ev.preventDefault(); ev.stopPropagation(); }
      startGame();
    };
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', handler);
  }

  function startGame() {
    initGame();
    running = true;
    overlay.classList.add('hidden');
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function showVictory() {
    overlay.innerHTML =
      '<h1 style="color:#ff0;text-shadow:0 0 30px #ff0;font-size:34px">🏆 БУРМАЛДА ПОБЕЖДЕНА 🏆</h1>' +
      '<p style="font-size:20px;color:#0f8">Ты убил Чекушку-Мать!</p>' +
      '<p style="font-size:16px">Финальный счёт: <span style="color:#0ff">' + score + '</span></p>' +
      '<p style="font-size:14px;opacity:0.6">Теперь ты — легенда КотаКбаса</p>' +
      '<button id="startBtn">БОЛЫ БУРМАЛДА</button>';
    overlay.classList.remove('hidden');
    bindStart();
  }

  function gameOver() {
    running = false;
    setTimeout(function(){
      overlay.innerHTML =
        '<h1 style="color:#f44;text-shadow:0 0 20px #f44;font-size:44px">АВАВА</h1>' +
        '<p style="font-size:22px;color:#0ff">Счёт: ' + score + '</p>' +
        (bossTriggered
          ? '<p style="font-size:14px;opacity:0.7">Ты почти победил босса...</p>'
          : '<p style="font-size:14px;opacity:0.7">До босса осталось: ' + (BOSS_TRIGGER - score) + ' убийств</p>') +
        '<button id="startBtn">БОЛЫ БУРМАЛДА</button>';
      overlay.classList.remove('hidden');
      bindStart();
    }, 400);
  }

  initGame();
  renderLifeCube(3);
  bindStart();
  requestAnimationFrame(idleLoop);

})();
</script>
</body>
</html>
